# Runs the aid's tests (aid/tests) on Windows and on Linux: with the Python the folder for Windows carries (the PYTHON_VERSION of
# folder.yml) and with Python 3.11, the oldest version the README names. The four runs are four records: Windows against Linux
# tells a fault of the system from a fault of the Python version. It builds nothing and publishes nothing; the folder is built,
# started and published by folder.yml, which does not wait for this run.
name: Tests

on:
  push:
    branches: [main]
    paths: ["aid/**", "evaluation/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. A newer push ends the run in progress: only the result of the newest commit matters.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false            # each run is a record of its own: one that fails does not end the others
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.13.17", "3.11"]
    env:
      PYTHONUTF8: "1"             # as the folder runs its Python (-X utf8, aid/portable.py)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Install the aid's packages and pytest
        shell: pwsh
        run: |
          python -m pip install -r aid/requirements.txt -r aid/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "pip ended with exit code $LASTEXITCODE" }

      # The command of the README, with warnings as errors and nothing written into the checkout. The two tests that start the real
      # launcher are left out, as in the recorded runs on Linux: folder.yml starts the real folder on Windows.
      - name: Run the tests
        shell: pwsh
        run: |
          python --version
          $tmp = Join-Path $env:RUNNER_TEMP "pytest"
          python -B -W error -m pytest aid/tests -q -p no:cacheprovider --basetemp $tmp -k "not real_launcher"
          if ($LASTEXITCODE -ne 0) { throw "pytest ended with exit code $LASTEXITCODE" }
